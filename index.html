<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>翻牌子 · 蜡笔小新</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --card-w: 140px;
    --card-h: 180px;
    --pink: #ff6b8a;
    --yellow: #ffe066;
    --green: #7bed9f;
    --blue: #70a1ff;
    --purple: #a29bfe;
    --orange: #ffa502;
    --white: #fffdf7;
  }

  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: linear-gradient(135deg, #fce4ec 0%, #fff3e0 30%, #e8f5e9 60%, #e3f2fd 100%);
    background-attachment: fixed;
    min-height: 100vh;
    min-height: 100dvh;
    color: #5d4037;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ===== 可爱浮动背景元素 ===== */
  .bg-float {
    position: fixed;
    pointer-events: none;
    z-index: 0;
    animation: floatAround 12s ease-in-out infinite;
    opacity: 0.6;
    font-size: 1.6rem;
  }
  .bg-float:nth-child(1) { top: 8%; left: 5%; animation-delay: 0s; font-size: 2rem; }
  .bg-float:nth-child(2) { top: 15%; right: 8%; animation-delay: -3s; font-size: 1.4rem; }
  .bg-float:nth-child(3) { top: 60%; left: 8%; animation-delay: -6s; font-size: 1.8rem; }
  .bg-float:nth-child(4) { top: 75%; right: 5%; animation-delay: -9s; font-size: 1.5rem; }
  .bg-float:nth-child(5) { top: 40%; left: 85%; animation-delay: -4s; font-size: 1.3rem; }
  .bg-float:nth-child(6) { top: 85%; left: 40%; animation-delay: -7s; font-size: 1.7rem; }
  .bg-float:nth-child(7) { top: 30%; left: 15%; animation-delay: -2s; font-size: 1.2rem; }
  .bg-float:nth-child(8) { top: 50%; right: 12%; animation-delay: -5s; font-size: 1.6rem; }

  @keyframes floatAround {
    0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
    25% { transform: translate(10px, -15px) rotate(5deg) scale(1.1); }
    50% { transform: translate(-5px, -25px) rotate(-3deg) scale(0.95); }
    75% { transform: translate(-12px, -8px) rotate(4deg) scale(1.05); }
  }

  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: linear-gradient(180deg, rgba(255,243,224,0.95) 60%, rgba(255,243,224,0) 100%);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 16px 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header h1 {
    font-size: 1.5rem;
    font-weight: 800;
    color: #e84393;
    text-shadow: 2px 2px 0 rgba(255,107,138,0.2);
  }
  .header-actions { display: flex; gap: 8px; }

  .btn {
    border: 2px solid #e84393;
    background: rgba(255,255,255,0.7);
    color: #e84393;
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    white-space: nowrap;
    backdrop-filter: blur(4px);
  }
  .btn:active { background: #fce4ec; transform: scale(0.94); }
  .btn-primary { background: #e84393; color: #fff; border-color: #e84393; }
  .btn-primary:active { background: #d63384; }

  .main {
    position: relative;
    z-index: 1;
    padding: 0 16px 50px;
  }

  .stats {
    text-align: center;
    margin-bottom: 20px;
    font-size: 0.85rem;
    color: #e84393;
    background: rgba(255,255,255,0.5);
    display: inline-block;
    padding: 6px 18px;
    border-radius: 20px;
    position: relative;
    left: 50%;
    transform: translateX(-50%);
    backdrop-filter: blur(4px);
    font-weight: 600;
  }
  .stats span { color: #6c5ce7; }

  .limit-banner {
    text-align: center;
    background: rgba(255,107,138,0.12);
    border: 2px dashed #ff6b8a;
    border-radius: 16px;
    padding: 10px 16px;
    margin-bottom: 20px;
    max-width: 420px;
    margin-left: auto;
    margin-right: auto;
    font-size: 0.85rem;
    color: #e84393;
    animation: fadeIn 0.4s ease;
    font-weight: 600;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: #e84393;
    opacity: 0.5;
  }
  .empty-state .icon { font-size: 3.5rem; margin-bottom: 12px; }
  .empty-state p { font-size: 1rem; line-height: 1.8; }

  .card-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 16px;
    max-width: 700px;
    margin: 0 auto;
  }

  .card-scene {
    perspective: 800px;
    width: var(--card-w);
    height: var(--card-h);
  }
  .card-scene.locked {
    opacity: 0.4;
    filter: grayscale(0.4);
    pointer-events: none;
  }

  .card {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card:not(.flipped):active { transform: scale(0.94); }

  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* ----- 背面（未翻）蜡笔小新主题 ----- */
  .card-back {
    border: 3px solid rgba(255,255,255,0.6);
    box-shadow:
      0 6px 24px rgba(232,67,147,0.18),
      inset 0 1px 0 rgba(255,255,255,0.4);
    position: relative;
  }
  .card-back::after {
    content: "";
    position: absolute;
    inset: 4px;
    border: 2px dashed rgba(255,255,255,0.5);
    border-radius: 10px;
    pointer-events: none;
  }
  .card-back-inner {
    text-align: center;
    z-index: 1;
  }
  .card-back-inner .avatar {
    font-size: 2.8rem;
    display: block;
    line-height: 1;
    margin-bottom: 4px;
    filter: drop-shadow(0 3px 4px rgba(0,0,0,0.15));
    animation: wiggle 2s ease-in-out infinite;
  }
  .card-back-inner .label {
    font-size: 0.72rem;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.2);
    letter-spacing: 0.06em;
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(0); }
    25% { transform: rotate(3deg); }
    75% { transform: rotate(-3deg); }
  }

  /* ----- 多彩背面配色方案 ----- */
  .card-back-0 { background: linear-gradient(145deg, #ff6b8a, #ff8e9e); }
  .card-back-1 { background: linear-gradient(145deg, #ffa502, #ffbe76); }
  .card-back-2 { background: linear-gradient(145deg, #7bed9f, #a3f7bf); }
  .card-back-3 { background: linear-gradient(145deg, #70a1ff, #98bfff); }
  .card-back-4 { background: linear-gradient(145deg, #a29bfe, #c4bfff); }
  .card-back-5 { background: linear-gradient(145deg, #ff6b8a, #fd79a8); }
  .card-back-6 { background: linear-gradient(145deg, #fdcb6e, #ffeaa7); }
  .card-back-7 { background: linear-gradient(145deg, #55efc4, #81ecec); }
  .card-back-8 { background: linear-gradient(145deg, #ff9ff3, #feca57); }
  .card-back-9 { background: linear-gradient(145deg, #ff6b6b, #ff9a9e); }
  .card-back-10 { background: linear-gradient(145deg, #a29bfe, #dfe6e9); }
  .card-back-11 { background: linear-gradient(145deg, #fd79a8, #fab1a0); }
  .card-back-12 { background: linear-gradient(145deg, #00cec9, #81ecec); }
  .card-back-13 { background: linear-gradient(145deg, #e17055, #fab1a0); }
  .card-back-14 { background: linear-gradient(145deg, #6c5ce7, #a29bfe); }
  .card-back-15 { background: linear-gradient(145deg, #f8b500, #ffe066); }
  .card-back-16 { background: linear-gradient(145deg, #26de81, #7bed9f); }
  .card-back-17 { background: linear-gradient(145deg, #fc5c65, #ff6b8a); }
  .card-back-18 { background: linear-gradient(145deg, #45aaf2, #70a1ff); }
  .card-back-19 { background: linear-gradient(145deg, #a55eea, #c4bfff); }

  /* ----- 正面（翻开）可爱风 ----- */
  .card-front {
    background: linear-gradient(145deg, #fffdf7 0%, #fff8e7 100%);
    border: 3px solid #ff6b8a;
    transform: rotateY(180deg);
    color: #5d4037;
    padding: 16px 12px;
    flex-direction: column;
    text-align: center;
    gap: 8px;
    box-shadow: 0 6px 24px rgba(232,67,147,0.2);
  }
  .card-front .seal {
    display: inline-block;
    border: 2px solid #e84393;
    color: #e84393;
    padding: 3px 12px;
    border-radius: 12px;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    transform: rotate(-3deg);
  }
  .card-front .content {
    font-size: 0.95rem;
    font-weight: 600;
    line-height: 1.5;
    word-break: break-all;
    flex: 1;
    display: flex;
    align-items: center;
    color: #4a2c2a;
  }

  /* ===== 设置面板 ===== */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 200;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    transition: opacity 0.3s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }

  .settings-panel {
    background: #fffdf7;
    border-radius: 24px 24px 0 0;
    width: 100%;
    max-width: 500px;
    max-height: 85vh;
    max-height: 85dvh;
    overflow-y: auto;
    padding: 28px 20px 36px;
    animation: slideUp 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 -4px 30px rgba(0,0,0,0.1);
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .settings-panel h2 {
    font-size: 1.2rem;
    color: #e84393;
    margin-bottom: 20px;
    text-align: center;
    font-weight: 800;
  }

  .form-group { margin-bottom: 14px; }
  .form-group label {
    display: block;
    font-size: 0.85rem;
    color: #e84393;
    margin-bottom: 6px;
    font-weight: 700;
  }
  .form-group input[type="range"] {
    width: 100%;
    accent-color: #e84393;
    height: 6px;
  }
  .form-group .range-val {
    text-align: center;
    color: #6c5ce7;
    font-size: 1.1rem;
    font-weight: 700;
  }

  .max-flips-setting {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 2px dashed #fce4ec;
  }
  .max-flips-setting select {
    width: 100%;
    padding: 10px 14px;
    border: 2px solid #fce4ec;
    border-radius: 12px;
    background: #fff;
    color: #5d4037;
    font-size: 0.9rem;
    font-family: inherit;
    outline: none;
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2712%27 height=%2712%27%3E%3Cpath d=%27M2 4l4 4 4-4%27 stroke=%27%23e84393%27 fill=%27none%27 stroke-width=%272%27/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 14px center;
    cursor: pointer;
    font-weight: 600;
  }

  .card-editor {
    border: 2px solid #fce4ec;
    border-radius: 14px;
    padding: 12px;
    margin-bottom: 10px;
    background: #fffbfc;
  }
  .card-editor .card-label {
    font-size: 0.8rem;
    color: #e84393;
    margin-bottom: 6px;
    font-weight: 700;
  }
  .card-editor input {
    width: 100%;
    padding: 10px 14px;
    border: 2px solid #fce4ec;
    border-radius: 12px;
    background: #fff;
    color: #5d4037;
    font-size: 0.9rem;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
    font-weight: 500;
  }
  .card-editor input:focus { border-color: #ff6b8a; }

  .settings-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }
  .settings-actions .btn { flex: 1; text-align: center; }

  .toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(232,67,147,0.92);
    color: #fff;
    padding: 14px 28px;
    border-radius: 24px;
    font-size: 0.95rem;
    font-weight: 700;
    z-index: 999;
    pointer-events: none;
    transition: opacity 0.3s;
    text-align: center;
    white-space: nowrap;
    box-shadow: 0 4px 20px rgba(232,67,147,0.3);
  }
  .toast.hidden { opacity: 0; }

  @media (max-width: 380px) {
    :root { --card-w: 115px; --card-h: 150px; }
    .card-grid { gap: 10px; }
    .header h1 { font-size: 1.25rem; }
    .card-back-inner .avatar { font-size: 2.2rem; }
  }
  @media (min-width: 500px) {
    :root { --card-w: 150px; --card-h: 195px; }
    .card-grid { gap: 20px; }
  }
</style>
</head>
<body>

  <!-- 浮动背景装饰 -->
  <div class="bg-float">🌸</div>
  <div class="bg-float">⭐</div>
  <div class="bg-float">💕</div>
  <div class="bg-float">🍡</div>
  <div class="bg-float">🎀</div>
  <div class="bg-float">🌟</div>
  <div class="bg-float">🫧</div>
  <div class="bg-float">💫</div>

  <header class="header">
    <h1>🍡 翻牌子 · 蜡笔小新</h1>
    <div class="header-actions">
      <button class="btn" onclick="openSettings()">⚙ 设置</button>
      <button class="btn" onclick="resetAll()">↺ 重翻</button>
    </div>
  </header>

  <main class="main" id="main">
    <div class="stats" id="stats"></div>
    <div id="limitBanner"></div>
    <div id="cardArea"></div>
  </main>

  <div class="overlay hidden" id="overlay" onclick="closeSettings(event)">
    <div class="settings-panel" onclick="event.stopPropagation()">
      <h2>⚙ 设置牌子</h2>
      <div class="form-group">
        <label>牌子数量</label>
        <input type="range" min="2" max="20" value="8" id="cardCount" oninput="updateCountLabel()">
        <div class="range-val" id="countLabel">8 块</div>
      </div>
      <div class="form-group max-flips-setting">
        <label>最多可翻数量</label>
        <select id="maxFlips">
          <option value="1">1 块</option>
          <option value="2" selected>2 块</option>
          <option value="3">3 块</option>
          <option value="5">5 块</option>
          <option value="99">不限</option>
        </select>
      </div>
      <div id="editorList"></div>
      <div class="settings-actions">
        <button class="btn" onclick="closeSettings()">取消</button>
        <button class="btn btn-primary" onclick="saveSettings()">✅ 保存</button>
      </div>
    </div>
  </div>

  <div class="toast hidden" id="toast"></div>

  <script>
  var STORAGE_KEY = "fanpaizi_v3_data";
  var cards = [];
  var flippedSet = new Set();
  var maxFlips = 2;

  // 每张牌子的专属图案（蜡笔小新主题，各不相同）
  var cardThemes = [
    { emoji: "🖍️", label: "小新蜡笔" },
    { emoji: "🐶", label: "小白" },
    { emoji: "🦸", label: "动感超人" },
    { emoji: "🍡", label: "小新最愛" },
    { emoji: "👶", label: "小葵" },
    { emoji: "🎒", label: "幼稚园" },
    { emoji: "🕺", label: "屁股舞" },
    { emoji: "🐷", label: "不理不理" },
    { emoji: "🌸", label: "妮妮" },
    { emoji: "⚽", label: "足球小新" },
    { emoji: "🎨", label: "画画时间" },
    { emoji: "🍛", label: "咖喱饭" },
    { emoji: "🎮", label: "电动宅" },
    { emoji: "😎", label: "墨镜新" },
    { emoji: "🛴", label: "小新座驾" },
    { emoji: "🎤", label: "卡拉OK" },
    { emoji: "📺", label: "最爱电视" },
    { emoji: "🍭", label: "糖果" },
    { emoji: "🦖", label: "恐龙新" },
    { emoji: "💤", label: "午睡时间" }
  ];

  var defaultCards = [
    "今晚洗碗 🍽️",
    "按摩 10 分钟 💆",
    "承包明天早餐 🥐",
    "夸夸对方三句话 💕",
    "免唠叨券一张 🎫",
    "做一杯手冲咖啡 ☕",
    "周末决定权归你 📅",
    "无条件道歉一次 🙇"
  ];

  function loadData() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var data = JSON.parse(raw);
        cards = data.cards || [];
        flippedSet = new Set(data.flipped || []);
        maxFlips = data.maxFlips != null ? data.maxFlips : 2;
        return;
      }
    } catch(e) {}
    cards = defaultCards.slice();
    flippedSet = new Set();
    maxFlips = 2;
  }

  function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      cards: cards,
      flipped: Array.from(flippedSet),
      maxFlips: maxFlips
    }));
  }

  function isLocked() {
    return maxFlips !== 99 && flippedSet.size >= maxFlips;
  }

  function render() {
    var cardArea = document.getElementById("cardArea");
    var stats = document.getElementById("stats");
    var limitBanner = document.getElementById("limitBanner");

    if (cards.length === 0) {
      cardArea.innerHTML = "<div class=\"empty-state\"><div class=\"icon\">🖍️</div><p>尚无牌子<br>点击右上角「⚙ 设置」添加</p></div>";
      stats.innerHTML = "";
      limitBanner.innerHTML = "";
      return;
    }

    var flippedCount = flippedSet.size;
    var locked = isLocked();
    var maxLabel = maxFlips === 99 ? "不限" : String(maxFlips);
    stats.innerHTML = "已翻 <span>" + flippedCount + "</span> / " + cards.length + " 块 （最多" + maxLabel + "块）";

    if (locked) {
      limitBanner.innerHTML = "<div class=\"limit-banner\">🔒 已翻满 " + maxFlips + " 块，其余牌子已锁定 · 点击「↺ 重翻」可重新来过</div>";
    } else {
      limitBanner.innerHTML = "";
    }

    var html = "<div class=\"card-grid\">";
    for (var i = 0; i < cards.length; i++) {
      var isFlipped = flippedSet.has(i);
      var sceneLocked = locked && !isFlipped;
      var theme = cardThemes[i % cardThemes.length];
      var colorClass = "card-back-" + (i % 20);
      var div = document.createElement("div");
      div.textContent = cards[i];
      var safeContent = div.innerHTML;

      html += "<div class=\"card-scene" + (sceneLocked ? " locked" : "") + "\" onclick=\"" + (sceneLocked ? "" : "flipCard(" + i + ")") + "\">";
      html += "<div class=\"card" + (isFlipped ? " flipped" : "") + "\" id=\"card-" + i + "\">";

      // 背面：专属图案
      html += "<div class=\"card-face card-back " + colorClass + "\">";
      html += "<div class=\"card-back-inner\">";
      html += "<span class=\"avatar\">" + theme.emoji + "</span>";
      html += "<span class=\"label\">" + theme.label + "</span>";
      html += "</div></div>";

      // 正面：内容
      html += "<div class=\"card-face card-front\">";
      html += "<span class=\"seal\">✧ 御旨 ✧</span>";
      html += "<span class=\"content\">" + safeContent + "</span>";
      html += "</div></div></div>";
    }
    html += "</div>";
    cardArea.innerHTML = html;
  }

  function flipCard(index) {
    if (isLocked()) {
      showToast("⚠ 已翻满 " + maxFlips + " 块，不能再翻了");
      return;
    }
    var el = document.getElementById("card-" + index);
    if (!el || flippedSet.has(index)) return;

    flippedSet.add(index);
    el.classList.add("flipped");
    saveData();
    render();
    if (navigator.vibrate) navigator.vibrate(10);
  }

  function resetAll() {
    if (cards.length === 0) return;
    flippedSet.clear();
    saveData();
    render();
    showToast("已重置所有牌子 🔄");
  }

  function openSettings() {
    document.getElementById("overlay").classList.remove("hidden");
    document.getElementById("cardCount").value = cards.length || 8;
    document.getElementById("maxFlips").value = String(maxFlips);
    updateCountLabel();
    renderEditors();
  }

  function closeSettings(e) {
    if (e && e.target !== document.getElementById("overlay")) return;
    document.getElementById("overlay").classList.add("hidden");
  }

  function updateCountLabel() {
    var v = document.getElementById("cardCount").value;
    document.getElementById("countLabel").textContent = v + " 块";
    renderEditors();
  }

  function renderEditors() {
    var count = parseInt(document.getElementById("cardCount").value);
    var list = document.getElementById("editorList");
    var html = "";
    for (var i = 0; i < count; i++) {
      var theme = cardThemes[i % cardThemes.length];
      var val = cards[i] || "";
      var div = document.createElement("div");
      div.textContent = val;
      html += "<div class=\"card-editor\">";
      html += "<div class=\"card-label\">" + theme.emoji + " 第 " + (i + 1) + " 号 · " + theme.label + "</div>";
      html += "<input type=\"text\" id=\"edit-" + i + "\" value=\"" + div.innerHTML + "\" placeholder=\"输入内容…\" maxlength=\"50\">";
      html += "</div>";
    }
    list.innerHTML = html;
  }

  function saveSettings() {
    var count = parseInt(document.getElementById("cardCount").value);
    var newMaxFlips = parseInt(document.getElementById("maxFlips").value);
    var newCards = [];
    for (var i = 0; i < count; i++) {
      var input = document.getElementById("edit-" + i);
      var val = (input ? input.value : "").trim();
      newCards.push(val || ("牌子 " + (i + 1)));
    }

    cards = newCards;
    maxFlips = newMaxFlips;

    var arr = [];
    flippedSet.forEach(function(v) { if (v < cards.length) arr.push(v); });
    flippedSet = new Set(arr);

    saveData();
    document.getElementById("overlay").classList.add("hidden");
    render();
    showToast("设置已保存 ✅");
  }

  var toastTimer;
  function showToast(msg) {
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.remove("hidden");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { el.classList.add("hidden"); }, 1800);
  }

  loadData();
  render();
  </script>
</body>
</html>
