<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>翻牌子 · 蜡笔小新</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --card-w: 140px;
    --card-h: 180px;
  }

  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: linear-gradient(135deg, #fce4ec 0%, #fff3e0 30%, #e8f5e9 60%, #e3f2fd 100%);
    background-attachment: fixed;
    min-height: 100vh;
    min-height: 100dvh;
    color: #5d4037;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  .bg-float {
    position: fixed;
    pointer-events: none;
    z-index: 0;
    animation: floatAround 12s ease-in-out infinite;
    opacity: 0.5;
    font-size: 1.6rem;
  }
  .bg-float:nth-child(1) { top: 6%; left: 4%; animation-delay: 0s; font-size: 2rem; }
  .bg-float:nth-child(2) { top: 12%; right: 7%; animation-delay: -3s; font-size: 1.4rem; }
  .bg-float:nth-child(3) { top: 55%; left: 6%; animation-delay: -6s; font-size: 1.8rem; }
  .bg-float:nth-child(4) { top: 72%; right: 4%; animation-delay: -9s; font-size: 1.5rem; }
  .bg-float:nth-child(5) { top: 38%; left: 82%; animation-delay: -4s; font-size: 1.3rem; }
  .bg-float:nth-child(6) { top: 82%; left: 35%; animation-delay: -7s; font-size: 1.7rem; }
  .bg-float:nth-child(7) { top: 28%; left: 12%; animation-delay: -2s; font-size: 1.2rem; }
  .bg-float:nth-child(8) { top: 48%; right: 10%; animation-delay: -5s; font-size: 1.6rem; }

  @keyframes floatAround {
    0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
    25% { transform: translate(10px, -14px) rotate(5deg) scale(1.1); }
    50% { transform: translate(-5px, -24px) rotate(-3deg) scale(0.95); }
    75% { transform: translate(-12px, -8px) rotate(4deg) scale(1.05); }
  }

  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: linear-gradient(180deg, rgba(255,243,224,0.95) 60%, rgba(255,243,224,0) 100%);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 14px 14px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px;
  }
  .header h1 {
    font-size: 1.35rem;
    font-weight: 800;
    color: #e84393;
    text-shadow: 2px 2px 0 rgba(255,107,138,0.12);
  }
  .header-actions { display: flex; gap: 6px; }

  .btn {
    border: 2px solid #e84393;
    background: rgba(255,255,255,0.7);
    color: #e84393;
    padding: 7px 13px;
    border-radius: 18px;
    font-size: 0.82rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    white-space: nowrap;
  }
  .btn:active { background: #fce4ec; transform: scale(0.94); }
  .btn-primary { background: #e84393; color: #fff; border-color: #e84393; }
  .btn-primary:active { background: #d63384; }

  .main {
    position: relative;
    z-index: 1;
    padding: 0 10px 50px;
  }

  .stats {
    text-align: center;
    margin-bottom: 16px;
    font-size: 0.8rem;
    color: #e84393;
    background: rgba(255,255,255,0.5);
    display: inline-block;
    padding: 5px 15px;
    border-radius: 16px;
    position: relative;
    left: 50%;
    transform: translateX(-50%);
    font-weight: 600;
  }
  .stats span { color: #6c5ce7; }

  .limit-banner {
    text-align: center;
    background: rgba(255,107,138,0.1);
    border: 2px dashed #ff6b8a;
    border-radius: 14px;
    padding: 9px 14px;
    margin-bottom: 16px;
    max-width: 400px;
    margin-left: auto;
    margin-right: auto;
    font-size: 0.82rem;
    color: #e84393;
    animation: fadeIn 0.4s ease;
    font-weight: 600;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }

  .empty-state {
    text-align: center;
    padding: 70px 20px;
    color: #e84393;
    opacity: 0.5;
  }
  .empty-state .icon { font-size: 3.5rem; margin-bottom: 10px; }
  .empty-state p { font-size: 0.95rem; line-height: 1.8; }

  .card-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 14px;
    max-width: 700px;
    margin: 0 auto;
  }

  .card-scene {
    perspective: 800px;
    width: var(--card-w);
    height: var(--card-h);
  }
  .card-scene.locked {
    opacity: 0.4;
    filter: grayscale(0.5);
    pointer-events: none;
  }

  .card {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card:not(.flipped):active { transform: scale(0.94); }

  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* 背面 — 蜡笔小新图片 */
  .card-back {
    border: 3px solid rgba(255,255,255,0.7);
    box-shadow: 0 5px 20px rgba(232,67,147,0.15);
    background-color: #f0e0d0;
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
  }
  .card-back::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 13px;
    background: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, transparent 40%, rgba(0,0,0,0.15) 100%);
    pointer-events: none;
  }
  .card-back .num-tag {
    position: absolute;
    bottom: 6px;
    right: 8px;
    background: rgba(232,67,147,0.85);
    color: #fff;
    font-size: 0.6rem;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 8px;
    z-index: 2;
  }
  .card-back .shuffle-indicator {
    position: absolute;
    top: 6px;
    left: 8px;
    background: rgba(255,255,255,0.8);
    color: #e84393;
    font-size: 0.55rem;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 6px;
    z-index: 2;
  }

  /* 正面 */
  .card-front {
    background: linear-gradient(145deg, #fffdf7 0%, #fff8e7 100%);
    border: 3px solid #ff6b8a;
    transform: rotateY(180deg);
    color: #5d4037;
    padding: 14px 10px;
    flex-direction: column;
    text-align: center;
    gap: 6px;
    box-shadow: 0 5px 20px rgba(232,67,147,0.18);
  }
  .card-front .seal {
    display: inline-block;
    border: 2px solid #e84393;
    color: #e84393;
    padding: 2px 10px;
    border-radius: 10px;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    transform: rotate(-2deg);
  }
  .card-front .content {
    font-size: 0.9rem;
    font-weight: 600;
    line-height: 1.45;
    word-break: break-all;
    flex: 1;
    display: flex;
    align-items: center;
    color: #4a2c2a;
  }

  /* ===== 设置面板 ===== */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 200;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    transition: opacity 0.3s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }

  .settings-panel {
    background: #fffdf7;
    border-radius: 22px 22px 0 0;
    width: 100%;
    max-width: 500px;
    max-height: 85vh;
    max-height: 85dvh;
    overflow-y: auto;
    padding: 26px 18px 34px;
    animation: slideUp 0.35s ease;
    box-shadow: 0 -4px 28px rgba(0,0,0,0.08);
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

  .settings-panel h2 { font-size: 1.15rem; color: #e84393; margin-bottom: 18px; text-align: center; font-weight: 800; }
  .form-group { margin-bottom: 12px; }
  .form-group label { display: block; font-size: 0.82rem; color: #e84393; margin-bottom: 5px; font-weight: 700; }
  .form-group input[type="range"] { width: 100%; accent-color: #e84393; height: 5px; }
  .form-group .range-val { text-align: center; color: #6c5ce7; font-size: 1.05rem; font-weight: 700; }

  .max-flips-setting { margin-top: 12px; padding-top: 12px; border-top: 2px dashed #fce4ec; }
  .max-flips-setting select {
    width: 100%; padding: 9px 12px;
    border: 2px solid #fce4ec; border-radius: 11px;
    background: #fff; color: #5d4037; font-size: 0.85rem; font-family: inherit;
    outline: none; cursor: pointer; font-weight: 600;
    appearance: none; -webkit-appearance: none;
    background-image: url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2712%27 height=%2712%27%3E%3Cpath d=%27M2 4l4 4 4-4%27 stroke=%27%23e84393%27 fill=%27none%27 stroke-width=%272%27/%3E%3C/svg%3E");
    background-repeat: no-repeat; background-position: right 12px center;
  }

  .card-editor {
    border: 2px solid #fce4ec; border-radius: 12px;
    padding: 10px 12px; margin-bottom: 8px; background: #fffbfc;
  }
  .card-editor .card-label { font-size: 0.78rem; color: #e84393; margin-bottom: 5px; font-weight: 700; }
  .card-editor input {
    width: 100%; padding: 9px 12px;
    border: 2px solid #fce4ec; border-radius: 10px;
    background: #fff; color: #5d4037; font-size: 0.85rem;
    font-family: inherit; outline: none; font-weight: 500;
    transition: border-color 0.2s;
  }
  .card-editor input:focus { border-color: #ff6b8a; }

  .settings-actions { display: flex; gap: 8px; margin-top: 18px; }
  .settings-actions .btn { flex: 1; text-align: center; }

  .toast {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(232,67,147,0.9); color: #fff;
    padding: 13px 26px; border-radius: 22px;
    font-size: 0.9rem; font-weight: 700; z-index: 999;
    pointer-events: none; transition: opacity 0.3s;
    text-align: center; white-space: nowrap;
    box-shadow: 0 4px 18px rgba(232,67,147,0.25);
  }
  .toast.hidden { opacity: 0; }

  @media (max-width: 380px) {
    :root { --card-w: 110px; --card-h: 145px; }
    .card-grid { gap: 8px; }
    .header h1 { font-size: 1.15rem; }
  }
  @media (min-width: 500px) {
    :root { --card-w: 150px; --card-h: 195px; }
    .card-grid { gap: 18px; }
  }
</style>
</head>

        <button class="btn btn-primary" onclick="saveSettings()">✅ 保存</button>

  var TOTAL_IMAGES = ALL_IMAGES.length;

  var STORAGE_KEY = "fanpaizi_v5_data";
  var cards = [];
  var flippedSet = new Set();
  var maxFlips = 2;
  var currentImageIndexes = []; // 当前这批牌子用的图片索引

  var defaultCards = [
    "今晚洗碗 🍽️",
    "按摩 10 分钟 💆",
    "承包明天早餐 🥐",
    "夸夸对方三句话 💕",
    "免唠叨券一张 🎫",
    "做一杯手冲咖啡 ☕",
    "周末决定权归你 📅",
    "无条件道歉一次 🙇"
  ];

  // Fisher-Yates 洗牌
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // 生成不重复的随机图片索引
  function pickRandomImages(count, previous) {
    // 把所有索引洗牌
    var all = [];
    for (var i = 0; i < TOTAL_IMAGES; i++) all.push(i);
    var shuffled = shuffle(all);

    // 如果之前有选过的，尽量避开（但不是必须）
    if (previous && previous.length > 0 && count <= TOTAL_IMAGES - previous.length) {
      var prevSet = {};
      for (var p = 0; p < previous.length; p++) prevSet[previous[p]] = true;
      var fresh = [];
      var reused = [];
      for (var s = 0; s < shuffled.length; s++) {
        if (prevSet[shuffled[s]]) reused.push(shuffled[s]);
        else fresh.push(shuffled[s]);
      }
      // 优先用没出现过的，不够再补
      var picked = fresh.slice(0, count);
      if (picked.length < count) {
        picked = picked.concat(reused.slice(0, count - picked.length));
      }
      return picked;
    }

    return shuffled.slice(0, count);
  }

  function loadData() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var data = JSON.parse(raw);
        cards = data.cards || [];
        flippedSet = new Set(data.flipped || []);
        maxFlips = data.maxFlips != null ? data.maxFlips : 2;
        currentImageIndexes = data.imgIndexes || [];
        // 如果图片索引不够（牌子变多了），补充
        while (currentImageIndexes.length < cards.length) {
          var used = {};
          for (var u = 0; u < currentImageIndexes.length; u++) used[currentImageIndexes[u]] = true;
          for (var k = 0; k < TOTAL_IMAGES; k++) {
            if (!used[k]) { currentImageIndexes.push(k); break; }
          }
          if (currentImageIndexes.length < cards.length) currentImageIndexes.push(0);
        }
        return;
      }
    } catch(e) {}
    cards = defaultCards.slice();
    flippedSet = new Set();
    maxFlips = 2;
    currentImageIndexes = pickRandomImages(cards.length, []);
  }

  function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      cards: cards,
      flipped: Array.from(flippedSet),
      maxFlips: maxFlips,
      imgIndexes: currentImageIndexes
    }));
  }

  function isLocked() {
    return maxFlips !== 99 && flippedSet.size >= maxFlips;
  }

  function render() {
    var cardArea = document.getElementById("cardArea");
    var stats = document.getElementById("stats");
    var limitBanner = document.getElementById("limitBanner");

    if (cards.length === 0) {
      cardArea.innerHTML = '<div class="empty-state"><div class="icon">🖍️</div><p>尚无牌子<br>点击右上角「⚙ 设置」添加</p></div>';
      stats.innerHTML = "";
      limitBanner.innerHTML = "";
      return;
    }

    var flippedCount = flippedSet.size;
    var locked = isLocked();
    var maxLabel = maxFlips === 99 ? "不限" : String(maxFlips);
    stats.innerHTML = "已翻 <span>" + flippedCount + "</span> / " + cards.length + " 块 · 图库 <span>" + TOTAL_IMAGES + "</span> 张 （最多" + maxLabel + "块）";

    if (locked) {
      limitBanner.innerHTML = '<div class="limit-banner">🔒 已翻满 ' + maxFlips + ' 块，其余牌子已锁定 · 点击「↺ 重翻」可重新来过</div>';
    } else {
      limitBanner.innerHTML = "";
    }

    var html = '<div class="card-grid">';
    for (var i = 0; i < cards.length; i++) {
      var isFlipped = flippedSet.has(i);
      var sceneLocked = locked && !isFlipped;
      var imgIdx = currentImageIndexes[i] || 0;
      var imgUrl = ALL_IMAGES[imgIdx];
      var div = document.createElement("div");
      div.textContent = cards[i];
      var safeContent = div.innerHTML;

      html += '<div class="card-scene' + (sceneLocked ? " locked" : "") + '" onclick="' + (sceneLocked ? "" : "flipCard(" + i + ")") + '">';
      html += '<div class="card' + (isFlipped ? " flipped" : "") + '" id="card-' + i + '">';

      // 背面：小新图片
      html += '<div class="card-face card-back" style="background-image:url(\'' + imgUrl + '\')">';
      html += '<span class="shuffle-indicator">#' + (imgIdx + 1) + '</span>';
      html += '<span class="num-tag">第' + (i + 1) + '号</span>';
      html += '</div>';

      // 正面
      html += '<div class="card-face card-front">';
      html += '<span class="seal">✧ 御旨 ✧</span>';
      html += '<span class="content">' + safeContent + '</span>';
      html += '</div></div></div>';
    }
    html += '</div>';
    cardArea.innerHTML = html;
  }

  function flipCard(index) {
    if (isLocked()) {
      showToast("⚠ 已翻满 " + maxFlips + " 块，不能再翻了");
      return;
    }
    var el = document.getElementById("card-" + index);
    if (!el || flippedSet.has(index)) return;

    flippedSet.add(index);
    el.classList.add("flipped");
    saveData();
    render();
    if (navigator.vibrate) navigator.vibrate(10);
  }

  function resetAll() {
    if (cards.length === 0) return;
    flippedSet.clear();
    // 每次重置随机换一批图片，尽量不重复
    currentImageIndexes = pickRandomImages(cards.length, currentImageIndexes);
    saveData();
    render();
    showToast("已重置，图片已刷新 🎴");
  }

  function openSettings() {
    document.getElementById("overlay").classList.remove("hidden");
    document.getElementById("cardCount").value = cards.length || 8;
    document.getElementById("maxFlips").value = String(maxFlips);
    updateCountLabel();
    renderEditors();
  }

  function closeSettings(e) {
    if (e && e.target !== document.getElementById("overlay")) return;
    document.getElementById("overlay").classList.add("hidden");
  }

  function updateCountLabel() {
    var v = document.getElementById("cardCount").value;
    document.getElementById("countLabel").textContent = v + " 块";
    renderEditors();
  }

  function renderEditors() {
    var count = parseInt(document.getElementById("cardCount").value);
    var list = document.getElementById("editorList");
    var html = "";
    for (var i = 0; i < count; i++) {
      var val = cards[i] || "";
      var div = document.createElement("div");
      div.textContent = val;
      html += '<div class="card-editor">';
      html += '<div class="card-label">🖍️ 第 ' + (i + 1) + ' 号牌子</div>';
      html += '<input type="text" id="edit-' + i + '" value="' + div.innerHTML + '" placeholder="输入内容…" maxlength="50">';
      html += '</div>';
    }
    list.innerHTML = html;
  }

  function saveSettings() {
    var count = parseInt(document.getElementById("cardCount").value);
    var newMaxFlips = parseInt(document.getElementById("maxFlips").value);
    var newCards = [];
    for (var i = 0; i < count; i++) {
      var input = document.getElementById("edit-" + i);
      var val = (input ? input.value : "").trim();
      newCards.push(val || ("牌子 " + (i + 1)));
    }

    var oldLen = cards.length;
    cards = newCards;
    maxFlips = newMaxFlips;

    // 如果牌子数量变了，重新随机选图
    if (cards.length !== oldLen) {
      var used = {};
      for (var u = 0; u < currentImageIndexes.length; u++) used[currentImageIndexes[u]] = true;
      var prevArr = [];
      for (var k in used) { if (used[k]) prevArr.push(parseInt(k)); }
      currentImageIndexes = pickRandomImages(cards.length, prevArr);
    }

    var arr = [];
    flippedSet.forEach(function(v) { if (v < cards.length) arr.push(v); });
    flippedSet = new Set(arr);

    saveData();
    document.getElementById("overlay").classList.add("hidden");
    render();
    showToast("设置已保存 ✅");
  }

  var toastTimer;
  function showToast(msg) {
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.remove("hidden");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { el.classList.add("hidden"); }, 1800);
  }

  loadData();
  render();
  </script>
