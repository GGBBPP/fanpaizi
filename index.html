<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>翻牌子</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="翻牌子">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🖍️</text></svg>">
<meta name="theme-color" content="#fce4ec">
<meta name="format-detection" content="telephone=no">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--cw:140px;--ch:180px}
html,body{width:100%;overflow-x:hidden;-webkit-overflow-scrolling:touch}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#fce4ec,#fff3e0,#e8f5e9,#e3f2fd);background-attachment:fixed;min-height:100vh;min-height:-webkit-fill-available;color:#5d4037;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;padding:env(safe-area-inset-top)0 env(safe-area-inset-bottom)}
.bg-float{position:fixed;pointer-events:none;z-index:0;animation:fa 14s ease-in-out infinite;opacity:.45;font-size:1.6rem}
.bg-float:nth-child(1){top:6%;left:4%;animation-delay:0s;font-size:2rem}
.bg-float:nth-child(2){top:12%;right:7%;animation-delay:-3.5s;font-size:1.4rem}
.bg-float:nth-child(3){top:55%;left:6%;animation-delay:-7s;font-size:1.8rem}
.bg-float:nth-child(4){top:72%;right:4%;animation-delay:-10.5s;font-size:1.5rem}
.bg-float:nth-child(5){top:38%;left:82%;animation-delay:-5s;font-size:1.3rem}
.bg-float:nth-child(6){top:82%;left:35%;animation-delay:-8s;font-size:1.7rem}
.bg-float:nth-child(7){top:28%;left:12%;animation-delay:-2s;font-size:1.2rem}
.bg-float:nth-child(8){top:48%;right:10%;animation-delay:-6s;font-size:1.6rem}
@keyframes fa{0%,100%{transform:translate(0,0)rotate(0deg)scale(1)}25%{transform:translate(8px,-12px)rotate(4deg)scale(1.08)}50%{transform:translate(-4px,-20px)rotate(-2deg)scale(.95)}75%{transform:translate(-10px,-6px)rotate(3deg)scale(1.05)}}
.header{position:sticky;top:0;z-index:100;background:linear-gradient(180deg,rgba(255,243,224,.95)60%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:max(14px,env(safe-area-inset-top))14px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
.header h1{font-size:1.35rem;font-weight:800;color:#e84393}
.header-actions{display:flex;gap:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;border:2px solid #e84393;background:rgba(255,255,255,.7);color:#e84393;padding:7px 13px;border-radius:18px;font-size:.82rem;font-weight:700;cursor:pointer;transition:all .2s;font-family:inherit;white-space:nowrap;min-height:36px}
.btn:active{background:#fce4ec;transform:scale(.94)}
.btn-primary{background:#e84393;color:#fff}
.main{position:relative;z-index:1;padding:0 10px max(50px,env(safe-area-inset-bottom))}
.stats{text-align:center;margin-bottom:16px;font-size:.8rem;color:#e84393;background:rgba(255,255,255,.5);display:inline-block;padding:5px 15px;border-radius:16px;position:relative;left:50%;transform:translateX(-50%);font-weight:600}
.stats span{color:#6c5ce7}
.limit-banner{text-align:center;background:rgba(255,107,138,.1);border:2px dashed #ff6b8a;border-radius:14px;padding:9px 14px;margin-bottom:16px;max-width:400px;margin-left:auto;margin-right:auto;font-size:.82rem;color:#e84393;animation:fadeIn .4s ease;font-weight:600}
@keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.empty-state{text-align:center;padding:70px 20px;color:#e84393;opacity:.5}
.empty-state .icon{font-size:3.5rem;margin-bottom:10px}
.card-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;max-width:750px;margin:0 auto;padding-bottom:10px}
.card-scene{perspective:800px;width:var(--cw);height:var(--ch)}
.card-scene.locked{opacity:.4;filter:grayscale(.5);pointer-events:none}
.card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1);cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.card:not(.flipped):active{transform:scale(.94)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card-back{border:3px solid rgba(255,255,255,.7);box-shadow:0 5px 20px rgba(232,67,147,.15);background-color:#f0e0d0;background-size:cover;background-position:center;background-repeat:no-repeat}
.card-front{background:linear-gradient(145deg,#fffdf7,#fff8e7);border:3px solid #ff6b8a;transform:rotateY(180deg);color:#5d4037;padding:10px 8px;flex-direction:column;text-align:center;gap:2px;box-shadow:0 5px 20px rgba(232,67,147,.18)}
.card-front .seal{display:inline-block;border:2px solid #e84393;color:#e84393;padding:2px 10px;border-radius:10px;font-size:.65rem;font-weight:700;letter-spacing:.06em;transform:rotate(-2deg)}
.card-front .emoji{font-size:1.8rem;line-height:1;margin:2px 0;animation:popIn .35s ease}
.card-front .content{font-size:.95rem;font-weight:700;line-height:1.3;word-break:keep-all;flex:1;display:flex;align-items:center;justify-content:center;color:#4a2c2a;letter-spacing:.03em}
@keyframes popIn{0%{transform:scale(0);opacity:0}70%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:flex-end;justify-content:center;transition:opacity .3s}
.overlay.hidden{opacity:0;pointer-events:none}
.settings-panel{background:#fffdf7;border-radius:22px 22px 0 0;width:100%;max-width:500px;max-height:85dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:26px 18px max(34px,env(safe-area-inset-bottom));animation:slideUp .35s ease;box-shadow:0 -4px 28px rgba(0,0,0,.08)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.settings-panel h2{font-size:1.15rem;color:#e84393;margin-bottom:18px;text-align:center;font-weight:800}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:.82rem;color:#e84393;margin-bottom:5px;font-weight:700}
.form-group input[type=range]{width:100%;accent-color:#e84393;height:5px}
.form-group .range-val{text-align:center;color:#6c5ce7;font-size:1.05rem;font-weight:700}
.max-flips-setting{margin-top:12px;padding-top:12px;border-top:2px dashed #fce4ec}
.max-flips-setting select{width:100%;padding:9px 12px;border:2px solid #fce4ec;border-radius:11px;background:#fff;color:#5d4037;font-size:.85rem;font-family:inherit;outline:none;cursor:pointer;font-weight:600;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2712%27 height=%2712%27%3E%3Cpath d=%27M2 4l4 4 4-4%27 stroke=%27%23e84393%27 fill=%27none%27 stroke-width=%272%27/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center}
.card-editor{border:2px solid #fce4ec;border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#fffbfc}
.card-editor .card-label{font-size:.78rem;color:#e84393;margin-bottom:5px;font-weight:700}
.card-editor input{width:100%;padding:9px 12px;border:2px solid #fce4ec;border-radius:10px;background:#fff;color:#5d4037;font-size:.85rem;font-family:inherit;outline:none;font-weight:500;transition:border-color .2s}
.card-editor input:focus{border-color:#ff6b8a}
.settings-actions{display:flex;gap:8px;margin-top:18px}
.settings-actions .btn{flex:1;text-align:center}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(232,67,147,.9);color:#fff;padding:13px 26px;border-radius:22px;font-size:.9rem;font-weight:700;z-index:999;pointer-events:none;transition:opacity .3s;text-align:center;white-space:nowrap;box-shadow:0 4px 18px rgba(232,67,147,.25)}
.toast.hidden{opacity:0}
@media(max-width:380px){:root{--cw:108px;--ch:140px}.card-grid{gap:8px}.header h1{font-size:1.15rem}.card-front .emoji{font-size:1.4rem}.card-front .content{font-size:.82rem}}
@media(min-width:500px){:root{--cw:150px;--ch:195px}.card-grid{gap:18px}}
@media(display-mode:standalone){body{padding-top:env(safe-area-inset-top)}}
</style>
</head>
<body>
<div class="bg-float">🌸</div><div class="bg-float">⭐</div><div class="bg-float">💕</div><div class="bg-float">🍡</div>
<div class="bg-float">🎀</div><div class="bg-float">🌟</div><div class="bg-float">🫧</div><div class="bg-float">💫</div>

<header class="header"><h1>翻牌子</h1><div class="header-actions"><button class="btn" onclick="oS()">⚙ 设置</button><button class="btn" onclick="rst()">↺ 重翻</button></div></header>
<main class="main" id="m"><div class="stats" id="st"></div><div id="lb"></div><div id="ca"></div></main>

<div class="overlay hidden" id="ov" onclick="cS(event)"><div class="settings-panel" onclick="event.stopPropagation()"><h2>⚙ 设置牌子</h2>
<div class="form-group"><label>牌子数量</label><input type="range" min="2" max="20" value="16" id="cn" oninput="uL()"><div class="range-val" id="cl">16 块</div></div>
<div class="form-group max-flips-setting"><label>最多可翻数量</label><select id="mf"><option value="1">1 块</option><option value="2" selected>2 块</option><option value="3">3 块</option><option value="5">5 块</option><option value="99">不限</option></select></div>
<div id="el"></div><div class="settings-actions"><button class="btn" onclick="cS()">取消</button><button class="btn btn-primary" onclick="sS()">✅ 保存</button></div></div></div>
<div class="toast hidden" id="to"></div>

<script>
var T=690;
function U(i){var n=String(i+1);while(n.length<4)n='0'+n;return'images/mobile_'+n+'.jpg'}
var SK='fp_v13',cards=[],flipped=new Set(),maxF=2,imgIdx=[];

// 16 项内容 + 专属 emoji
var def=[
  {t:'拼积木',e:'🧩'},{t:'练书法',e:'🖌️'},{t:'弹吉他',e:'🎸'},{t:'弹尤克里里',e:'🪕'},
  {t:'弹古筝',e:'🎶'},{t:'弹卡林巴琴',e:'🎹'},{t:'画画',e:'🎨'},{t:'涂色',e:'🖍️'},
  {t:'折纸',e:'📄'},{t:'语言',e:'🗣️'},{t:'学习考证',e:'📚'},{t:'学习塔罗牌',e:'🔮'},
  {t:'看书',e:'📖'},{t:'学习国学',e:'📜'},{t:'玩游戏',e:'🎮'},{t:'休息',e:'😴'}
];

function shuf(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=b[i];b[i]=b[j];b[j]=t}return b}
function pick(n,prev){var a=[];for(var i=0;i<T;i++)a.push(i);var s=shuf(a);if(prev&&prev.length&&n<=T-prev.length){var ps={},fr=[],ru=[];for(var p=0;p<prev.length;p++)ps[prev[p]]=1;for(var j=0;j<s.length;j++)ps[s[j]]?ru.push(s[j]):fr.push(s[j]);var pk=fr.slice(0,n);if(pk.length<n)pk=pk.concat(ru.slice(0,n-pk.length));return pk}return s.slice(0,n)}

function ld(){
  try{var r=localStorage.getItem(SK);if(r){var d=JSON.parse(r);cards=d.c||[];flipped=new Set(d.f||[]);maxF=d.m!=null?d.m:2;imgIdx=d.i||[];while(imgIdx.length<cards.length){var u={};for(var j=0;j<imgIdx.length;j++)u[imgIdx[j]]=1;var ok=0;for(var k=0;k<T;k++)if(!u[k]){imgIdx.push(k);ok=1;break}if(!ok)imgIdx.push(0)}return}}catch(e){}
  cards=def.slice();flipped=new Set();maxF=2;imgIdx=pick(cards.length,[])
}
function sv(){localStorage.setItem(SK,JSON.stringify({c:cards,f:Array.from(flipped),m:maxF,i:imgIdx}))}
function lk(){return maxF!==99&&flipped.size>=maxF}

function rd(){
  var ca=document.getElementById('ca'),st=document.getElementById('st'),lb=document.getElementById('lb');
  if(!cards.length){ca.innerHTML='<div class="empty-state"><div class="icon">🖍️</div><p>尚无牌子<br>点击右上角「⚙ 设置」添加</p></div>';st.innerHTML='';lb.innerHTML='';return}
  var fc=flipped.size,lo=lk(),ml=maxF===99?'不限':String(maxF);
  st.innerHTML='已翻 <span>'+fc+'</span> / '+cards.length+' 块 · 图库 <span>'+T+'</span> 张（最多'+ml+'块）';
  lb.innerHTML=lo?'<div class="limit-banner">🔒 已翻满 '+maxF+' 块，点击「↺ 重翻」重新来过</div>':'';
  var h='<div class="card-grid">';
  for(var i=0;i<cards.length;i++){
    var fl=flipped.has(i),sl=lo&&!fl,idx=imgIdx[i]||0,url=U(idx);
    var item=cards[i],txt=item.t||item,em=item.e||'';
    var d=document.createElement('div');d.textContent=txt;var sc=d.innerHTML;
    h+='<div class="card-scene'+(sl?' locked':'')+'" onclick="'+(sl?'':'fp('+i+')')+'">';
    h+='<div class="card'+(fl?' flipped':'')+'" id="c-'+i+'">';
    h+='<div class="card-face card-back" style="background-image:url(\''+url+'\')"></div>';
    h+='<div class="card-face card-front"><span class="seal">✧ 御旨 ✧</span><span class="emoji">'+em+'</span><span class="content">'+sc+'</span></div>';
    h+='</div></div>';
  }
  h+='</div>';ca.innerHTML=h
}

function fp(i){if(lk()){tm('⚠ 已翻满 '+maxF+' 块');return}var el=document.getElementById('c-'+i);if(!el||flipped.has(i))return;flipped.add(i);el.classList.add('flipped');sv();rd();if(navigator.vibrate)navigator.vibrate(10)}
function rst(){if(!cards.length)return;flipped.clear();cards=shuf(cards);imgIdx=pick(cards.length,imgIdx);sv();rd();tm('已刷新，内容已打乱 🎴')}
function mid(){var n=new Date(),m=new Date(n);m.setHours(24,0,0,0);var ms=m-n;if(ms<6e4)ms=6e4;setTimeout(function(){location.reload()},ms)}
function oS(){document.getElementById('ov').classList.remove('hidden');document.getElementById('cn').value=cards.length||16;document.getElementById('mf').value=String(maxF);uL();rE()}
function cS(e){if(e&&e.target!==document.getElementById('ov'))return;document.getElementById('ov').classList.add('hidden')}
function uL(){document.getElementById('cl').textContent=document.getElementById('cn').value+' 块';rE()}
function rE(){var n=parseInt(document.getElementById('cn').value),l=document.getElementById('el'),h='';for(var i=0;i<n;i++){var item=cards[i];var v=item?item.t||item:'';var d=document.createElement('div');d.textContent=v;h+='<div class="card-editor"><div class="card-label">🖍️ 第 '+(i+1)+' 号</div><input id="e-'+i+'" value="'+d.innerHTML+'" placeholder="输入内容…" maxlength="50"></div>'}l.innerHTML=h}
function sS(){var n=parseInt(document.getElementById('cn').value),nm=parseInt(document.getElementById('mf').value),nc=[];for(var i=0;i<n;i++){var inp=document.getElementById('e-'+i);var txt=(inp?inp.value:'').trim()||('牌子 '+(i+1));var em=def[i]?def[i].e:'';nc.push({t:txt,e:em})}var ol=cards.length;cards=nc;maxF=nm;if(cards.length!==ol){var u={};for(var k=0;k<imgIdx.length;k++)u[imgIdx[k]]=1;var pa=[];for(var x in u)if(u[x])pa.push(parseInt(x));imgIdx=pick(cards.length,pa)}var a=[];flipped.forEach(function(v){if(v<cards.length)a.push(v)});flipped=new Set(a);sv();document.getElementById('ov').classList.add('hidden');rd();tm('已保存 ✅')}
var tt;function tm(m){var e=document.getElementById('to');e.textContent=m;e.classList.remove('hidden');clearTimeout(tt);tt=setTimeout(function(){e.classList.add('hidden')},1500)}
ld();rd();mid();
</script>
</body>
</html>
